          "@type": "Question",

          "acceptedAnswer": {
            "@type": "Answer",

        },
        {
          "@type": "Question",
          "name": "¿Hay descuentos por varios días?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Contratando 4 días o más accedés a un 15% de descuento automático."
          }
        },
        {
          "@type": "Question",
          "name": "¿Dónde está ubicado Espacio Auditorium?",

            "@type": "Answer",
            "text": "Marcelo T. de Alvear 2153, 2° Piso, Recoleta, CABA. Frente a la Facultad de Odontología UBA, a dos cuadras de Medicina. Subte línea D y múltiples colectivos."
